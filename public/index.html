f}.mybtn{background:#eaf4ff;color:#145ac5;border:1px solid #cce1f8}

@media(max-width:390px){.brandText b{font-size:23px}.brandBall{width:50px;height:50px}.heroArt{min-height:220px}.heroCopy h1{font-size:31px}.b8{width:112px;height:112px;left:25px;top:48px}.b1{width:62px;height:62px}.b2{width:65px;height:65px}.b3,.b6{width:54px;height:54px}.award{min-height:132px}.award strong{font-size:15px}.grid{gap:7px}.num span{font-size:13px}}
</style></head><body><div class="app">
<header class="topbar"><div class="brandBall"></div><div class="brandText"><b>8 BALL እጣ</b><span>ዕድልዎን ይሞክሩ!</span></div><div class="topActions"><button class="topBtn bell" onclick="showNotices()">🔔</button><button class="topBtn">☰</button></div></header>
<section class="hero"><div class="heroArt"><div class="balls"><div class="ball b8"><span>8</span></div><div class="ball b1"><span>1</span></div><div class="ball b2"><span>2</span></div><div class="ball b3"><span>3</span></div><div class="ball b6"><span>6</span></div></div><div class="heroCopy"><h1>8 BALL እጣ</h1><div class="tag">ዕድልዎን ይሞክሩ!</div></div></div><div class="heroPrize"><div><small>🏆 ትልቁ ሽልማት</small><strong id="mainPrize">— ETB</strong></div><button class="cta" onclick="document.getElementById('numbers').scrollIntoView({behavior:'smooth'})">🎱 ትኬት ይምረጡ</button></div></section>
<main class="wrap"><section id="authCard" class="card welcome"><div><b>እንኳን ደህና መጡ!</b><div class="muted">ለመሳተፍ ስምና ስልክ ያስገቡ።</div></div><button class="primary" onclick="openAuth()">ጀምር</button></section>
<div id="home"></div>
<section class="card info"><div class="i">i</div><span>የተመረጡ ትኬቶችዎን ከመክፈል በፊት ያረጋግጡ!</span><button onclick="go('my',this)">👁 ይመልከቱ</button></section>
<section class="card prizeBoard"><div class="sectionHead"><b>🏆 የሽልማት ደረጃዎች</b><span class="pill">3 አሸናፊዎች</span></div><div class="prizeGrid" id="prizeBoard"></div></section>

<section id="wins" class="card"><b>🏆 የቅርብ አሸናፊዎች</b><div class="winners" id="winners"></div></section></main>
<nav class="nav"><button class="active" onclick="go('numbers',this)"><span>⌂</span>ዋና ገጽ</button><button onclick="go('numbers',this)"><span>🎟️</span>ትኬቶች</button><button onclick="go('wins',this)"><span>🎁</span>ሽልማት</button><button onclick="go('my',this)"><span>♙</span>መገለጫ</button><button onclick="showNotices()"><span>⚙</span>ማስታወቂያ</button></nav>
</div><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeAuth()">✕</button><h2>መመዝገቢያ</h2><input class="input" id="name" placeholder="ሙሉ ስም"><input class="input" id="phone" inputmode="numeric" maxlength="10" placeholder="ስልክ ቁጥር (10 ዲጂት)"><button class="primary" style="width:100%;margin-top:8px" onclick="register()">መቀጠል</button><p class="muted" id="msg"></p></div></div><div class="toast" id="toast"></div>
<script>
let token=localStorage.getItem('lottery-token')||'',user=JSON.parse(localStorage.getItem('lottery-user')||'null'),round=null,state=null,me={tickets:[]},rounds=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function openAuth(){$('modal').classList.add('show')}function closeAuth(){$('modal').classList.remove('show')}function go(id,b){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active')}
async function register(){const name=$('name').value.trim(),phone=$('phone').value.trim();if(name.length<2)return $('msg').textContent='ስም ያስገቡ።';if(!/^\d{10}$/.test(phone))return $('msg').textContent='10 ዲጂት ስልክ ያስገቡ።';const r=await fetch('/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})}),j=await r.json();if(!r.ok)return $('msg').textContent=j.error||'ምዝገባ አልተሳካም።';user=j.user;token=j.token;localStorage.setItem('lottery-user',JSON.stringify(user));localStorage.setItem('lottery-token',token);closeAuth();await load();toast('እንኳን ደህና መጡ!')}
async function load(){try{const rr=await fetch('/api/rounds/today');const jj=await rr.json();rounds=jj.rounds||[];round=rounds.find(x=>x.status==='open')||rounds.find(x=>x.status==='draft')||rounds[0];if(round){const s=await fetch('/api/rounds/'+round.id+'/state');state=await s.json()}else state=null;if(token){const m=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});if(m.ok)me=await m.json();else{token='';localStorage.removeItem('lottery-token');me={tickets:[]}}}render()}catch(e){toast('ከሰርቨሩ ጋር መገናኘት አልቻለም።')}}
function render(){if(!round){$('mainPrize').textContent='ዙር አልተከፈተም';$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">አሁን ላይ ክፍት ዙር የለም።</div>';if($('prizeBoard'))$('prizeBoard').innerHTML='';return}const prizes=Array.isArray(round.prizes)?round.prizes:JSON.parse(round.prizes||'[]');const p=[Number(prizes[0]||0),Number(prizes[1]||0),Number(prizes[2]||0)];$('mainPrize').textContent=p[0].toLocaleString()+' ETB';$('price').textContent=Number(round.ticket_price).toLocaleString()+' ETB';$('roundNo')?.textContent=round.round_no;const icons=['🏆','🥈','🥉'];$('prizeBoard').innerHTML=p.map((amount,i)=>`<div class="award"><div class="cup">${icons[i]}</div><small>${i+1}ኛ ሽልማት</small><strong>${amount.toLocaleString()} ETB</strong><span>🎱 አሸናፊ ኳስ</span></div>`).join('');const taken=state?.taken||{},remaining=Math.max(0,Number(round.max_numbers)-Object.keys(taken).length);$('remaining').textContent=`${remaining.toLocaleString()} ቀርተዋል / ${Number(round.max_numbers).toLocaleString()}`;$('alert').innerHTML=remaining<=10&&remaining>0?`<div class="notice">🔥 ${remaining} ትኬቶች ብቻ ቀርተዋል!</div>`:remaining<=20&&remaining>0?`<div class="notice">⚡ ትኬቶች በፍጥነት እየሞሉ ነው!</div>`:remaining===0?`<div class="notice">🎉 ዙሩ ተሞልቷል!</div>`:'';let h='';for(let n=1;n<=Number(round.max_numbers);n++){if(taken[n])continue;const c=[['#ffe33b','#f6a500','#8a5100'],['#38a2ff','#1264dc','#06377d'],['#ff5966','#dc1026','#75000b'],['#a05cff','#5b17d5','#270064'],['#ff9a3d','#ed6200','#7c2b00'],['#32e999','#08a05f','#005331'],['#ff4b7c','#b30b3d','#5d0020']][(n-1)%7];h+=`<button class="num" style="--c1:${c[0]};--c2:${c[1]};--c3:${c[2]}" data-number="${n}" onclick="take(${n})" aria-label="ቁጥር ${n}"><span>${n}</span></button>`}$('grid').innerHTML=h||'<div class="empty" style="grid-column:1/-1">ሁሉም ቁጥሮች ተይዘዋል።</div>';const mine=me.tickets||[];$('myCount').textContent=mine.length;$('mine').innerHTML=mine.length?mine.slice(0,20).map(t=>`<span>#${t.number} ${t.status==='paid'?'✓ ተከፍሏል':'⏳ በመጠባበቅ ላይ'}</span>`).join(''):'<div class="empty">እስካሁን ትኬት አልያዙም።</div>';$('winners').innerHTML=(state?.winners||[]).slice(0,3).map(w=>`<div class="winner ${w.place===1?'gold':''}"><b>${esc(w.place_label)}</b><span>🎱 #${w.number} • ${Number(w.prize).toLocaleString()} ETB</span></div>`).join('')||'<div class="empty">እስካሁን ውጤት የለም።</div>';if(user)$('authCard').innerHTML=`<div><b>👤 ${esc(user.name)}</b><div class="muted">${esc(user.phone)}</div></div><span class="pill">የተጠቃሚ መለያ</span>`}
async function take(n){if(!user){openAuth();return}if(!round||round.status!=='open')return toast('ዙሩ ክፍት አይደለም።');const ball=document.querySelector(`.num[data-number="${n}"]`);if(!ball||ball.classList.contains('selecting'))return;if(!confirm(`#${n} ቁጥርን መያዝ ይፈልጋሉ?`))return;ball.classList.add('selecting','selected');const r=await fetch('/api/take',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({roundId:round.id,number:n})}),j=await r.json();if(!r.ok){ball.classList.remove('selecting','selected');await load();return toast(j.error||'አልተሳካም።')}toast(`🎱 #${n} ተይዟል ✓`);await load()}
async function showNotices(){if(!token)return toast('መጀመሪያ ይመዝገቡ።');try{const r=await fetch('/api/me/notifications',{headers:{Authorization:'Bearer '+token}});const j=await r.json();alert((j.notifications||[]).map(x=>x.message).join('\n\n')||'አዲስ ማስታወቂያ የለም።')}catch(e){toast('ማስታወቂያ ማምጣት አልተቻለም።')}}
load();setInterval(load,7000);
</script></body></html>
