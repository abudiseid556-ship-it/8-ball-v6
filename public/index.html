<!-- ማስታወቂያ የሚታይበት ቦታ -->
<div id="announcement-banner" style="display: none; background: #e7f3fe; border-left: 6px solid #2196F3; padding: 12px; margin: 15px; border-radius: 4px;">
  <strong>ማስታወቂያ:</strong> <span id="announcement-text"></span>
</div>

<script>
async function loadAnnouncement() {
  try {
    const res = await fetch('/api/announcements/special');
    const data = await res.json();
    if (data && data.active && data.message) {
      document.getElementById('announcement-text').innerText = data.message;
      document.getElementById('announcement-banner').style.display = 'block';
    } else {
      document.getElementById('announcement-banner').style.display = 'none';
    }
  } catch (err) {
    console.error('ማስታወቂያ ማምጣት አልተቻለም:', err);
  }
}
loadAnnouncement();
</script>
