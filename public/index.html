<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ዕድልዎን ይሞክሩ</title><style>
:root{--blue:#1463ff;--ink:#14213d;--muted:#71809a;--bg:#f4f7ff;--card:#fff;--green:#10b981;--red:#ef4444;--shadow:0 12px 35px #173b7a18}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5ff,#f8faff);font-family:system-ui,-apple-system,"Noto Sans Ethiopic",sans-serif;color:var(--ink)}.app{max-width:520px;margin:auto;min-height:100vh}.hero{padding:22px 18px 28px;background:linear-gradient(135deg,#0d55e8,#45a5ff);color:#fff;border-radius:0 0 30px 30px;box-shadow:0 14px 35px #1463ff35}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.bell{width:44px;height:44px;border:0;border-radius:50%;background:#ffffff22;color:#fff;font-size:20px}.prize{margin-top:20px;background:#ffffff18;border:1px solid #ffffff35;border-radius:24px;padding:18px}.prize small{opacity:.85}.big{font-size:38px;font-weight:1000;line-height:1.1;margin:6px 0}.cta{display:block;text-align:center;background:#fff;color:#1258dd;text-decoration:none;border-radius:16px;padding:14px;font-weight:900;margin-top:14px}.wrap{padding:16px}.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted);font-size:13px}.progress{height:9px;background:#e8eefb;border-radius:20px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,#14b8a6,#1463ff);border-radius:20px}.notice{padding:13px;border-radius:16px;background:#fff7df;color:#875b00;font-weight:800;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.num{aspect-ratio:1;border:0;border-radius:50%;background:#edf3ff;color:#1455c8;font-weight:900;font-size:15px;box-shadow:inset 0 -2px 0 #dbe6ff;transition:.12s}.num:active{transform:scale(.9)}.num.last{box-shadow:0 0 0 3px #ffd166,0 7px 18px #ffb00035;background:#fff7db;color:#a45b00}.empty{color:#9aa6bb;text-align:center;padding:24px}.mine{display:flex;flex-wrap:wrap;gap:8px}.mine span{padding:9px 12px;border-radius:14px;background:#e9fff7;color:#087d5d;font-weight:900}.pill{padding:6px 10px;border-radius:20px;background:#eef3ff;color:#2756a8;font-size:12px;font-weight:800}.winner{display:flex;justify-content:space-between;align-items:center;padding:13px;border-radius:16px;background:#f6f8ff;margin-top:8px}.gold{background:linear-gradient(135deg,#fff0b3,#fffaf0);border:1px solid #f5cf5b}.modal{position:fixed;inset:0;background:#09152b88;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:28px 28px 0 0;padding:22px}.input{width:100%;padding:14px;border:1px solid #dce4f2;border-radius:14px;margin:7px 0;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900}.primary{background:var(--blue);color:#fff;width:100%}.close{float:right;background:#edf2fb}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 17px;border-radius:15px;display:none;z-index:9}.nav{position:sticky;bottom:0;padding:10px 16px 16px;background:#ffffffee;backdrop-filter:blur(12px);display:flex;gap:8px}.nav button{flex:1;border:0;background:#eef3ff;border-radius:15px;padding:11px;font-weight:800;color:#456}.nav button.active{background:#1463ff;color:#fff}
</style></head><body><div class="app"><section class="hero"><div class="top"><div class="brand">🎟️ ዕድልዎን ይሞክሩ</div><button class="bell" onclick="showNotices()">🔔</button></div><div class="prize"><small>የአሁኑ ዙር • <span id="roundNo">—</span></small><div class="big" id="mainPrize">— ETB</div><div id="subPrizes"></div><a class="cta" href="#numbers">ዕድልዎን ይሞክሩ →</a></div></section><main class="wrap"><div id="authCard" class="card"><b>እንኳን ደህና መጡ</b><p class="muted">ለመሳተፍ ስምዎንና ስልክዎን ያስገቡ።</p><button class="btn primary" onclick="openAuth()">መጀመሪያ ጀምር</button></div><div id="home"></div><section id="numbers" class="card"><div class="row"><div><b>ክፍት ቁጥሮች</b><div class="muted" id="remaining">—</div></div><span class="pill" id="price">—</span></div><div id="alert"></div><div class="grid" id="grid"></div></section><section id="my" class="card"><div class="row"><b>የእኔ ትኬቶች</b><span class="pill" id="myCount">0</span></div><div class="mine" id="mine"></div></section><section id="wins" class="card"><b>🏆 የቅርብ አሸናፊዎች</b><div id="winners"></div></section></main><div class="nav"><button class="active" onclick="go('numbers',this)">🎟️ ትኬቶች</button><button onclick="go('my',this)">👤 የእኔ</button><button onclick="go('wins',this)">🏆 አሸናፊዎች</button></div></div><div class="modal" id="modal"><div class="sheet"><button class="btn close" onclick="closeAuth()">✕</button><h2>መመዝገቢያ</h2><input class="input" id="name" placeholder="ሙሉ ስም"><input class="input" id="phone" inputmode="numeric" maxlength="10" placeholder="ስልክ ቁጥር (10 ዲጂት)"><button class="btn primary" onclick="register()">መቀጠል</button><p class="muted" id="msg"></p></div></div><div class="toast" id="toast"></div><script>
let token=localStorage.getItem('lottery-token')||'',user=JSON.parse(localStorage.getItem('lottery-user')||'null'),round=null,state=null,me={tickets:[]};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function openAuth(){$('modal').classList.add('show')}function closeAuth(){$('modal').classList.remove('show')}function go(id,b){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function register(){const name=$('name').value.trim(),phone=$('phone').value.trim();if(name.length<2)return $('msg').textContent='ስም ያስገቡ።';if(!/^\d{10}$/.test(phone))return $('msg').textContent='10 ዲጂት ስልክ ያስገቡ።';const r=await fetch('/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})}),j=await r.json();if(!r.ok)return $('msg').textContent=j.error||'ምዝገባ አልተሳካም።';user=j.user;token=j.token;localStorage.setItem('lottery-user',JSON.stringify(user));localStorage.setItem('lottery-token',token);closeAuth();await load();toast('እንኳን ደህና መጡ!')}
async function load(){try{const rr=await fetch('/api/rounds/today');const jj=await rr.json();rounds=jj.rounds||[];round=rounds.find(x=>x.status==='open')||rounds.find(x=>x.status==='draft')||rounds[0];if(round){const s=await fetch('/api/rounds/'+round.id+'/state');state=await s.json()}else state=null;if(token){const m=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});if(m.ok)me=await m.json();else{token='';localStorage.removeItem('lottery-token');me={tickets:[]}}}render()}catch(e){toast('ከሰርቨሩ ጋር መገናኘት አልቻለም።')}}
function render(){if(!round){$('mainPrize').textContent='ዙር አልተከፈተም';$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">አሁን ላይ ክፍት ዙር የለም።</div>';return}const prizes=Array.isArray(round.prizes)?round.prizes:JSON.parse(round.prizes||'[]');$('roundNo').textContent=round.round_no;$('mainPrize').textContent=Number(prizes[0]||0).toLocaleString()+' ETB';$('subPrizes').textContent=prizes.slice(1).map((p,i)=>(i+2)+'ኛ '+Number(p).toLocaleString()+' ETB').join('  •  ');$('price').textContent=Number(round.ticket_price).toLocaleString()+' ETB';const taken=state?.taken||{},remaining=Math.max(0,Number(round.max_numbers)-Object.keys(taken).length);$('remaining').textContent=`${remaining.toLocaleString()} ቀርተዋል / ${Number(round.max_numbers).toLocaleString()}`;$('alert').innerHTML=remaining<=10&&remaining>0?`<div class="notice">🔥 ቶሎ ይጨርሳል! ${remaining} ትኬቶች ብቻ ቀርተዋል።</div>`:remaining<=20&&remaining>0?`<div class="notice">⚡ ትኬቶች እየተሞሉ ነው!</div>`:remaining===0?`<div class="notice">🎉 ዙሩ ተሞልቷል!</div>`:'';let h='';for(let n=1;n<=round.max_numbers;n++){if(taken[n])continue;h+=`<button class="num ${n===Number(round.max_numbers)?'last':''}" onclick="take(${n})">${n}</button>`}$('grid').innerHTML=h||'<div class="empty" style="grid-column:1/-1">ሁሉም ቁጥሮች ተይዘዋል።</div>';const mine=me.tickets||[];$('myCount').textContent=mine.length;$('mine').innerHTML=mine.length?mine.slice(0,20).map(t=>`<span>#${t.number} ${t.status==='paid'?'✓':'⏳'}</span>`).join(''):'<div class="empty">እስካሁን ትኬት አልያዙም።</div>';$('winners').innerHTML=(state?.winners||[]).map(w=>`<div class="winner ${w.place===1?'gold':''}"><b>${esc(w.place_label)}</b><span>#${w.number} • ${Number(w.prize).toLocaleString()} ETB</span></div>`).join('')||'<div class="empty">እስካሁን ውጤት የለም።</div>';if(user){$('authCard').innerHTML=`<div class="row"><b>👤 ${esc(user.name)}</b><span class="pill">የተጠቃሚ</span></div><div class="muted">${esc(user.phone)}</div>`}}
async function take(n){if(!user){openAuth();return}if(!round||round.status!=='open')return toast('ዙሩ ክፍት አይደለም።');if(!confirm(`#${n} ቁጥርን መያዝ ይፈልጋሉ?`))return;const r=await fetch('/api/take',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({roundId:round.id,number:n})}),j=await r.json();if(!r.ok)return toast(j.error||'አልተሳካም።');toast(`#${n} ተይዟል ✓`);await load()}
function showNotices(){let rem=round?round.max_numbers-Object.keys(state?.taken||{}).length:0;alert(`🔔 ማሳወቂያዎች\n\n${rem>0&&rem<=10?'🚨 10 ትኬቶች ብቻ ቀርተዋል!\n':''}${rem>10&&rem<=20?'🔥 ዙሩ በፍጥነት እየሞላ ነው!\n':''}${me.tickets?.some(t=>t.status==='pending')?'⏳ አንድ ወይም ከዚያ በላይ ክፍያ የሚጠብቅ ትኬት አለዎት።\n':''}🏆 የአሸናፊዎችን ውጤት ይከታተሉ።`) }let rounds=[];load();setInterval(load,4000);
</script></body></html>
