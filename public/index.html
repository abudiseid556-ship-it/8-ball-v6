<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>🎱 8 BALL እጣ — ዕድልዎን ይሞክሩ!</title><style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#eef5ff,#f8faff);font-family:system-ui,-apple-system,"Noto Sans Ethiopic",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh}.hero{padding:22px 18px 30px;background:linear-gradient(135deg,#0b45b7 0%,#1463ff 48%,#4aabff 100%);color:#fff;border-radius:0 0 34px 34px;box-shadow:0 18px 42px #1463ff38;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-100px;top:-90px;background:#ffffff18;filter:blur(2px)}

.prize{margin-top:18px;background:linear-gradient(145deg,#ffffff22,#ffffff0d);border:1px solid #ffffff42;border-radius:28px;padding:18px;position:relative;z-index:1;box-shadow:inset 0 1px #ffffff25,0 16px 30px #052f8a22;backdrop-filter:blur(10px)}.prize small{opacity:.88}.jackpot-title{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:900}.trophy{font-size:30px;filter:drop-shadow(0 6px 10px #0003);animation:trophyFloat 2.8s ease-in-out infinite}.big{font-size:40px;font-weight:1000;letter-spacing:-1px;line-height:1.05;margin:4px 0}.cta{display:block;text-align:center;background:#fff;color:#1258dd;text-decoration:none;border-radius:17px;padding:14px;font-weight:950;margin-top:15px;box-shadow:0 8px 20px #062e8122}.prize-mini{margin-top:9px;font-size:13px;font-weight:800;opacity:.9}
.wrap{padding:16px}.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted);font-size:13px}.pill{padding:7px 11px;border-radius:20px;background:#eef3ff;color:#2756a8;font-size:12px;font-weight:900}
.prize-board{padding:15px;background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #e4ebf7}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head b{font-size:17px}.prize-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:9px}.award{position:relative;min-height:118px;border-radius:20px;padding:12px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border:1px solid #e6ebf5;background:linear-gradient(145deg,#fff,#f2f6ff);box-shadow:0 9px 22px #173b7a12}.award:before{content:"";position:absolute;inset:-30% auto auto -20%;width:90px;height:90px;border-radius:50%;background:#ffffff99}.award:first-child{background:linear-gradient(145deg,#fff5c9,#fffdf5 55%,#ffe69a);border-color:#f3cf68;box-shadow:0 12px 28px #d79d2928}.award:nth-child(2){background:linear-gradient(145deg,#f4f7fb,#fff);border-color:#d5dce8}.award:nth-child(3){background:linear-gradient(145deg,#fff0e6,#fff);border-color:#efc5a7}.award-icon{font-size:30px;filter:drop-shadow(0 5px 8px #0002);position:relative;z-index:1}.award-rank{font-size:11px;font-weight:950;color:#63718a;position:relative;z-index:1}.award:first-child .award-rank{color:#9a6500}.award-amount{font-size:16px;font-weight:1000;margin-top:3px;position:relative;z-index:1}.award:first-child .award-amount{font-size:19px;color:#9a6500}.award-ball{font-size:11px;font-weight:950;margin-top:5px;position:relative;z-index:1}
.progress{height:9px;background:#e8eefb;border-radius:20px;overflow:hidden;margin:10px 0}.bar{height:100%;background:linear-gradient(90deg,#14b8a6,#1463ff);border-radius:20px}.notice{padding:13px;border-radius:16px;background:#fff7df;color:#875b00;font-weight:850;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.num{position:relative;aspect-ratio:1;border:0;border-radius:50%;color:#fff;font-weight:1000;font-size:16px;cursor:pointer;overflow:hidden;box-shadow:inset 0 5px 7px #ffffff70,inset 0 -8px 10px #0003,0 5px 10px #102c6020;transition:transform .16s,opacity .22s,filter .22s;isolation:isolate}.num:before{content:"";position:absolute;width:42%;height:25%;left:15%;top:10%;border-radius:50%;background:#fff9;filter:blur(2px);transform:rotate(-20deg);z-index:-1}.num:after{content:"";position:absolute;left:50%;top:50%;width:35%;height:35%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;z-index:-1}.num{background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#ef4b5f 0 42%,#b51d31 70%,#6f0e1c 100%)}
.num:nth-child(15n+2){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#ffd52e 0 42%,#d49c00 70%,#8a6100 100%)}.num:nth-child(15n+3){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#2f82ff 0 42%,#1450ba 70%,#092e72 100%)}.num:nth-child(15n+4){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#ff743d 0 42%,#cc3d16 70%,#7a220b 100%)}.num:nth-child(15n+5){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#742dce 0 42%,#4b168d 70%,#26084e 100%)}.num:nth-child(15n+6){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#19bd75 0 42%,#087d4d 70%,#03482c 100%)}.num:nth-child(15n+7){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#c93b46 0 42%,#98212c 70%,#5d0f17 100%)}.num:nth-child(15n+8){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#202531 0 42%,#080b12 72%,#000 100%)}.num:nth-child(15n+9){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#f1ad26 0 42%,#c97b00 70%,#7d4800 100%)}.num:nth-child(15n+10){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#1672ed 0 42%,#1049a2 70%,#08255a 100%)}.num:nth-child(15n+11){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#f45b3f 0 42%,#bc2c17 70%,#70170b 100%)}.num:nth-child(15n+12){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#7040c7 0 42%,#461d8c 70%,#260d51 100%)}.num:nth-child(15n+13){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#18b86f 0 42%,#087b49 70%,#03442a 100%)}.num:nth-child(15n+14){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#c9323e 0 42%,#921722 70%,#560b12 100%)}.num:nth-child(15n+15){background:radial-gradient(circle at 32% 25%,#fff9 0 8%,transparent 9%),radial-gradient(circle at 50% 58%,#111820 0 42%,#05070a 72%,#000 100%)}
.num:active{transform:scale(.86)}.num.selecting{transform:scale(1.18);opacity:0;filter:blur(4px)}
.empty{color:#9aa6bb;text-align:center;padding:24px}.mine{display:flex;flex-wrap:wrap;gap:8px}.mine span{padding:9px 12px;border-radius:14px;background:#e9fff7;color:#087d5d;font-weight:900}.winner{display:flex;justify-content:space-between;align-items:center;padding:13px;border-radius:16px;background:#f6f8ff;margin-top:8px}.gold{background:linear-gradient(135deg,#fff0b3,#fffaf0);border:1px solid #f5cf5b}
.modal{position:fixed;inset:0;background:#09152b88;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:28px 28px 0 0;padding:22px}.input{width:100%;padding:14px;border:1px solid #dce4f2;border-radius:14px;margin:7px 0;font-size:16px}.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900}.primary{background:var(--blue);color:#fff;width:100%}.close{float:right;background:#edf2fb}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 17px;border-radius:15px;display:none;z-index:9}.nav{position:sticky;bottom:0;padding:10px 16px 16px;background:#ffffffee;backdrop-filter:blur(12px);display:flex;gap:8px;z-index:4}.nav button{flex:1;border:0;background:#eef3ff;border-radius:15px;padding:11px;font-weight:800;color:#456}.nav button.active{background:#1463ff;color:#fff}
@keyframes trophyFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@media(max-width:390px){.grid{gap:7px}.num{font-size:14px}.prize-grid{gap:7px}.award{min-height:108px}.award-amount{font-size:14px}.award:first-child .award-amount{font-size:16px}}
</style></head><body><div class="app"><section class="hero"><div class="top"><div class="brand">🎱 8 BALL እጣ</div><button class="bell" onclick="showNotices()">🔔</button></div><div class="prize"><small>የአሁኑ ዙር • <span id="roundNo">—</span></small><div class="jackpot-title"><span class="trophy">🏆</span><span>ዕድልዎን ይሞክሩ!</span></div><div class="big" id="mainPrize">— ETB</div><div class="prize-mini">🎱 8 BALL እጣ • 3 አሸናፊዎች</div><a class="cta" href="#numbers">🎱 ቁጥርዎን ይምረጡ →</a></div></section><main class="wrap"><div id="authCard" class="card"><b>እንኳን ደህና መጡ</b><p class="muted">ለመሳተፍ ስምዎንና ስልክዎን ያስገቡ።</p><button class="btn primary" onclick="openAuth()">መጀመሪያ ጀምር</button></div><div id="home"></div><section class="card prize-board"><div class="section-head"><b>🏆 የሽልማት ደረጃዎች</b><span class="pill">3 ሽልማቶች</span></div><div class="prize-grid" id="prizeBoard"></div></section><section id="numbers" class="card"><div class="row"><div><b>🎱 የሚመረጡ ኳሶች</b><div class="muted" id="remaining">—</div></div><span class="pill" id="price">—</span></div><div id="alert"></div><div class="grid" id="grid"></div></section><section id="my" class="card"><div class="row"><b>የእኔ ትኬቶች</b><span class="pill" id="myCount">0</span></div><div class="mine" id="mine"></div></section><section id="wins" class="card"><b>🏆 የቅርብ አሸናፊዎች</b><div id="winners"></div></section></main><div class="nav"><button class="active" onclick="go('numbers',this)">🎟️ ትኬቶች</button><button onclick="go('my',this)">👤 የእኔ</button><button onclick="go('wins',this)">🏆 አሸናፊዎች</button></div></div><div class="modal" id="modal"><div class="sheet"><button class="btn close" onclick="closeAuth()">✕</button><h2>መመዝገቢያ</h2><input class="input" id="name" placeholder="ሙሉ ስም"><input class="input" id="phone" inputmode="numeric" maxlength="10" placeholder="ስልክ ቁጥር (10 ዲጂት)"><button class="btn primary" onclick="register()">መቀጠል</button><p class="muted" id="msg"></p></div></div><div class="toast" id="toast"></div><script>
let token=localStorage.getItem('lottery-token')||'',user=JSON.parse(localStorage.getItem('lottery-user')||'null'),round=null,state=null,me={tickets:[]};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function openAuth(){$('modal').classList.add('show')}function closeAuth(){$('modal').classList.remove('show')}function go(id,b){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function register(){const name=$('name').value.trim(),phone=$('phone').value.trim();if(name.length<2)return $('msg').textContent='ስም ያስገቡ።';if(!/^\d{10}$/.test(phone))return $('msg').textContent='10 ዲጂት ስልክ ያስገቡ።';const r=await fetch('/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})}),j=await r.json();if(!r.ok)return $('msg').textContent=j.error||'ምዝገባ አልተሳካም።';user=j.user;token=j.token;localStorage.setItem('lottery-user',JSON.stringify(user));localStorage.setItem('lottery-token',token);closeAuth();await load();toast('እንኳን ደህና መጡ!')}
async function load(){try{const rr=await fetch('/api/rounds/today');const jj=await rr.json();rounds=jj.rounds||[];round=rounds.find(x=>x.status==='open')||rounds.find(x=>x.status==='draft')||rounds[0];if(round){const s=await fetch('/api/rounds/'+round.id+'/state');state=await s.json()}else state=null;if(token){const m=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});if(m.ok)me=await m.json();else{token='';localStorage.removeItem('lottery-token');me={tickets:[]}}}render()}catch(e){toast('ከሰርቨሩ ጋር መገናኘት አልቻለም።')}}
function render(){if(!round){$('mainPrize').textContent='ዙር አልተከፈተም';$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">አሁን ላይ ክፍት ዙር የለም።</div>';if($('prizeBoard'))$('prizeBoard').innerHTML='';return}const prizes=Array.isArray(round.prizes)?round.prizes:JSON.parse(round.prizes||'[]');const p=[Number(prizes[0]||0),Number(prizes[1]||0),Number(prizes[2]||0)];$('roundNo').textContent=round.round_no;$('mainPrize').textContent=p[0].toLocaleString()+' ETB';$('price').textContent=Number(round.ticket_price).toLocaleString()+' ETB';if($('prizeBoard'))$('prizeBoard').innerHTML=p.map((amount,i)=>{const icons=['🏆','🥈','🥉'];return `<div class="award"><div class="award-icon">${icons[i]}</div><div class="award-rank">${i+1}ኛ ሽልማት</div><div class="award-amount">${amount.toLocaleString()} ETB</div><div class="award-ball">🎱 አሸናፊ ኳስ</div></div>`}).join('');const taken=state?.taken||{},remaining=Math.max(0,Number(round.max_numbers)-Object.keys(taken).length);$('remaining').textContent=`${remaining.toLocaleString()} ቀርተዋል / ${Number(round.max_numbers).toLocaleString()}`;$('alert').innerHTML=remaining<=10&&remaining>0?`<div class="notice">🔥 ቶሎ ይጨርሳል! ${remaining} ትኬቶች ብቻ ቀርተዋል።</div>`:remaining<=20&&remaining>0?`<div class="notice">⚡ ትኬቶች እየተሞሉ ነው!</div>`:remaining===0?`<div class="notice">🎉 ዙሩ ተሞልቷል!</div>`:'';let h='';for(let n=1;n<=Number(round.max_numbers);n++){if(taken[n])continue;h+=`<button class="num" data-number="${n}" onclick="take(${n})" aria-label="ቁጥር ${n}"><span>${n}</span></button>`}$('grid').innerHTML=h||'<div class="empty" style="grid-column:1/-1">ሁሉም ቁጥሮች ተይዘዋል።</div>';const mine=me.tickets||[];$('myCount').textContent=mine.length;$('mine').innerHTML=mine.length?mine.slice(0,20).map(t=>`<span>#${t.number} ${t.status==='paid'?'✓':'⏳'}</span>`).join(''):'<div class="empty">እስካሁን ትኬት አልያዙም።</div>';$('winners').innerHTML=(state?.winners||[]).slice(0,3).map(w=>`<div class="winner ${w.place===1?'gold':''}"><b>${esc(w.place_label)}</b><span>🎱 #${w.number} • ${Number(w.prize).toLocaleString()} ETB</span></div>`).join('')||'<div class="empty">እስካሁን ውጤት የለም።</div>';if(user){$('authCard').innerHTML=`<div class="row"><b>👤 ${esc(user.name)}</b><span class="pill">የተጠቃሚ</span></div><div class="muted">${esc(user.phone)}</div>`}}
async function take(n){if(!user){openAuth();return}if(!round||round.status!=='open')return toast('ዙሩ ክፍት አይደለም።');const ball=document.querySelector(`.num[data-number="${n}"]`);if(!ball||ball.classList.contains('selecting'))return;if(!confirm(`#${n} ቁጥርን መያዝ ይፈልጋሉ?`))return;ball.classList.add('selecting');setTimeout(()=>{if(ball.isConnected)ball.remove()},220);const r=await fetch('/api/take',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({roundId:round.id,number:n})}),j=await r.json();if(!r.ok){await load();return toast(j.error||'አልተሳካም።')}toast(`🎱 #${n} ተይዟል ✓`);await load()}
function showNotices(){let rem=round?round.max_numbers-Object.keys(state?.taken||{}).length:0;alert(`🔔 ማሳወቂያዎች\n\n${rem>0&&rem<=10?'🚨 10 ትኬቶች ብቻ ቀርተዋል!\n':''}${rem>10&&rem<=20?'🔥 ዙሩ በፍጥነት እየሞላ ነው!\n':''}${me.tickets?.some(t=>t.status==='pending')?'⏳ አንድ ወይም ከዚያ በላይ ክፍያ የሚጠብቅ ትኬት አለዎት።\n':''}🏆 የአሸናፊዎችን ውጤት ይከታተሉ።`) }let rounds=[];load();setInterval(load,4000);
</script></body></html>
