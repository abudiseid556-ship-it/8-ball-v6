<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0757d9"><title>8 BALL እጣ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#10244a;font-family:system-ui,"Noto Sans Ethiopic",sans-serif}.app{max-width:520px;margin:auto;padding-bottom:82px}
.top{padding:15px;border-radius:0 0 26px 26px;color:#fff;background:linear-gradient(135deg,#063b9c,#0875f5);box-shadow:0 8px 25px #174b6330}.brand{display:flex;align-items:center;gap:10px}.b8{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#555,#111 45%,#000);border:3px solid #ffd54a;color:#111;font-size:26px;font-weight:900}.b8:after{content:"8";background:#fff;border-radius:50%;padding:8px 13px}.brand h1{margin:0;color:#ffd33d;font-size:30px;text-shadow:0 3px 5px #00235c}.brand p{margin:4px 0;font-weight:800}.menu{margin-left:auto;background:#ffffff18;color:white;border:1px solid #ffffff55;border-radius:24px;padding:9px 13px;font-size:22px}

.section{margin:12px}.card{background:white;border-radius:24px;padding:14px;box-shadow:0 8px 28px #315b8b18}.title{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:900;margin-bottom:10px}.pill{background:#e9f2ff;color:#1555ad;padding:8px 12px;border-radius:20px;font-weight:900}.prizes{display:grid;grid-template-columns:1.12fr 1fr 1fr;gap:8px}.prize{text-align:center;color:white;border-radius:18px;padding:8px 4px}.one{background:linear-gradient(150deg,#ffe477,#dc9600)}.two{background:linear-gradient(150deg,#dcecff,#356db5)}.three{background:linear-gradient(150deg,#ffb17b,#b83e20)}.cup{font-size:45px}.amount{font-size:16px;font-weight:1000}.prize small{font-weight:700}.info{margin-top:10px;padding:10px;border-radius:17px;background:#edf8ff;color:#1262c2;text-align:center;font-weight:800}.balls{margin-top:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 7px}.ball{width:55px;height:55px;margin:auto;border:2px solid #fff9;border-radius:50%;position:relative;display:grid;place-items:center;color:#111;font-weight:1000;background:linear-gradient(145deg,#55a9ff,#0753bd);box-shadow:inset -7px -9px 12px #0005,inset 5px 5px 9px #fff8,0 5px 9px #1233;transition:.25s}.ball:after{content:"";position:absolute;width:23px;height:23px;background:white;border-radius:50%}.ball span{z-index:1}.ball:nth-child(5n+1){background:linear-gradient(145deg,#ffd72e,#df9300)}.ball:nth-child(5n+3){background:linear-gradient(145deg,#ff5661,#c91529)}.ball:nth-child(5n+4){background:linear-gradient(145deg,#b65cff,#6513b5)}.ball:nth-child(5n){background:linear-gradient(145deg,#ff9c35,#e05c00)}.ball.selected{transform:scale(1.08);opacity:1;filter:none;pointer-events:auto;border:4px solid #ffd43d;box-shadow:0 0 0 4px #ffd43d55,inset -7px -9px 12px #0005,inset 5px 5px 9px #fff8,0 7px 16px #ffd43d99}.ball.selected:before{content:'✓';position:absolute;z-index:3;right:-5px;top:-7px;width:22px;height:22px;border-radius:50%;background:#16a765;color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid #fff}.actions{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:18px;padding:14px 8px;font-size:15px;font-weight:900}.primary{color:#fff;background:linear-gradient(90deg,#0878ef,#7d28f5)}.secondary{background:#edf4ff;color:#1555ae}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:76px;background:#fff;border-top:1px solid #dce7f5;display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.nav{text-align:center;color:#69758e;font-weight:800;font-size:12px}.nav b{display:block;font-size:25px}.active{color:#0863dc}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="b8"></div><div><h1>8 BALL እጣ</h1><p>ዕድልዎን ይሞክሩ!</p></div><button class="menu">☰</button></div></header>
<section class="hero"><div class="big"><span>8</span></div><div class="copy"><strong>8 BALL እጣ</strong><em>ዕድልዎን ይሞክሩ!</em></div></section>
<section class="section"><div class="card"><div class="title"><span>🏆 የሽልማት ደረጃዎች</span><span class="pill">200,000 ETB</span></div><div class="prizes"><div class="prize one"><div class="cup">🏆</div><div class="amount">200,000 ETB</div><small>1ኛ • 5 ቁጥር</small></div><div class="prize two"><div class="cup">🏆</div><div class="amount">50,000 ETB</div><small>2ኛ • 4 ቁጥር</small></div><div class="prize three"><div class="cup">🏆</div><div class="amount">10,000 ETB</div><small>3ኛ • 3 ቁጥር</small></div></div><div class="info">ℹ️ ትልቁን ዕድል አሁኑኑ ይሞክሩ!</div></div>
<div class="card balls"><div class="title"><span>🎱 ቁጥር ይምረጡ</span><span class="pill">200 ETB</span></div><div class="grid" id="grid"></div><div class="actions"><button class="btn primary" onclick="alert('🎯 እባክዎ ቁጥር ይምረጡ')">🎯 ትኬትን ይምረጡ →</button><button class="btn secondary">🎟️ ትኬቶቼ</button></div></div></section></div>

<script>const g=document.getElementById('grid');for(let i=1;i<=25;i++){let b=document.createElement('button');b.className='ball';b.innerHTML='<span>'+i+'</span>';b.onclick=()=>{if(!b.classList.contains('selected')){b.classList.add('selected');b.dataset.selected='true';}};g.appendChild(b)}</script></body></html>
