<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Lottery</title><style>
body{margin:0;background:#f3f6fc;color:#14213d;font-family:system-ui,"Noto Sans Ethiopic",sans-serif}.app{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#102a63,#1769ff);color:#fff;padding:22px;border-radius:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;padding:18px;border-radius:20px;box-shadow:0 10px 30px #12305d12;margin:14px 0}.input,.select{width:100%;padding:13px;border:1px solid #dce4ef;border-radius:12px;margin:6px 0;box-sizing:border-box}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:900}.primary{background:#1463ff;color:#fff}.green{background:#0fa779;color:#fff}.red{background:#ef4444;color:#fff}.gray{background:#edf2fa}.round{border:1px solid #e4eaf4;border-radius:17px;padding:14px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.stat{font-size:28px;font-weight:1000}.muted{color:#71809a;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.login{max-width:420px;margin:15vh auto}.prizeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body><div class="app"><div id="login" class="card login"><h2>🛡️ Admin</h2><p class="muted">ይህ ገጽ ለአድሚን ብቻ ነው።</p><input id="pin" class="input" type="password" placeholder="Admin PIN"><button class="btn primary" style="width:100%" onclick="login()">ግባ</button><p id="msg" class="muted"></p></div><div id="panel" style="display:none"><section class="hero"><h1>🎯 Lottery Admin</h1><p>ዙሮችን ይፍጠሩ፣ ይጀምሩ፣ ይዝጉ፣ ክፍያን ያረጋግጡ እና እጣ ያውጡ።</p><button class="btn gray" onclick="logout()">🚪 ውጣ</button></section><div class="grid"><div class="card"><div class="muted">የዛሬ ዙሮች</div><div class="stat" id="roundCount">0</div></div><div class="card"><div class="muted">ተጠቃሚዎች</div><div class="stat" id="usersCount">0</div></div></div><div class="card"><h2>➕ አዲስ ዙር</h2><div class="grid"><div><label>ቀን</label><input id="date" class="input" type="date"></div><div><label>ዙር ቁጥር</label><input id="no" class="input" type="number" min="1" value="1"></div><div><label>የትኬት ዋጋ (ETB)</label><input id="price" class="input" type="number" min="1" value="100"></div><div><label>የቁጥር ብዛት</label><input id="max" class="input" type="number" min="1" value="500"></div></div><h3>🏆 የእጣ ሽልማቶች</h3><div class="prizeRow"><input id="p1" class="input" type="number" placeholder="1ኛ ሽልማት" value="50000"><input id="p2" class="input" type="number" placeholder="2ኛ ሽልማት" value="10000"><input id="p3" class="input" type="number" placeholder="3ኛ ሽልማት" value="5000"><input id="p4" class="input" type="number" placeholder="4ኛ ሽልማት (ካለ)" value="0"></div><button class="btn primary" onclick="createRound()">ዙር ፍጠር</button></div><div class="card"><h2>📋 ዙሮች</h2><div id="rounds"></div></div><div class="card"><h2>👥 ተጠቃሚዎች</h2><div style="overflow:auto"><table><thead><tr><th>ስም</th><th>ስልክ</th><th>ትኬቶች</th></tr></thead><tbody id="users"></tbody></table></div></div></div></div><script>
let token='';const ADMIN_IDLE_TIMEOUT=15*60*1000;let idleTimer=null;let lastActivity=0;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt),j=await r.json();if(!r.ok)throw new Error(j.error||'ስህተት');return j}function resetIdleTimer(){if(!token)return;lastActivity=Date.now();clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(token){alert('🔐 የአድሚን ጊዜ አልቋል። እንደገና ይግቡ።');logout()}},ADMIN_IDLE_TIMEOUT)}
function setupIdleTimeout(){['click','touchstart','keydown','scroll'].forEach(ev=>document.addEventListener(ev,resetIdleTimer,{passive:true}));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&token&&Date.now()-lastActivity>=ADMIN_IDLE_TIMEOUT)logout()});}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})}),j=await r.json();if(!r.ok)throw new Error(j.error);token=j.token;sessionStorage.setItem('lottery-admin-session','1');$('pin').value='';$('login').style.display='none';$('panel').style.display='block';resetIdleTimer();load()}catch(e){$('msg').textContent=e.message}}
function logout(){token='';clearTimeout(idleTimer);sessionStorage.removeItem('lottery-admin-session');location.reload()}
async function createRound(){try{const prizes=[$('p1').value,$('p2').value,$('p3').value,$('p4').value].map(Number).filter(x=>x>0);await api('/api/admin/rounds',{method:'POST',body:JSON.stringify({drawDate:$('date').value,roundNo:Number($('no').value),ticketPrice:Number($('price').value),maxNumbers:Number($('max').value),prizes})});alert('ዙሩ ተፈጥሯል። አሁን “ጀምር” ይጫኑ።');load()}catch(e){alert(e.message)}}
async function load(){try{const [a,u]=await Promise.all([api('/api/admin/rounds'),api('/api/admin/users')]);$('roundCount').textContent=a.rounds.length;$('usersCount').textContent=u.users.length;$('users').innerHTML=u.users.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.tickets}</td></tr>`).join('');$('rounds').innerHTML=a.rounds.map(r=>{const ps=Array.isArray(r.prizes)?r.prizes:JSON.parse(r.prizes||'[]');return `<div class="round"><div><b>ዙር #${r.round_no}</b> • ${esc(r.draw_date)} • <b>${esc(r.status)}</b></div><div class="muted">${Number(r.max_numbers).toLocaleString()} ቁጥሮች • ${Number(r.ticket_price).toLocaleString()} ETB • Paid ${r.paid_count}/${r.ticket_count} • Sales ${Number(r.sales).toLocaleString()} ETB</div><div class="muted">🏆 ${ps.map((p,i)=>(i+1)+'ኛ '+Number(p).toLocaleString()+' ETB').join(' • ')}</div><div class="actions" style="margin-top:10px">${r.status==='draft'?`<button class="btn green" onclick="start('${r.id}')">▶️ ጀምር</button>`:''}${r.status==='open'?`<button class="btn red" onclick="closeRound('${r.id}')">⏹️ ዝጋ</button>`:''}${r.status==='closed'?`<button class="btn primary" onclick="draw('${r.id}')">🎲 እጣ አውጣ</button>`:''}<button class="btn gray" onclick="details('${r.id}')">ዝርዝር</button></div></div>`}).join('')||'<p class="muted">ዙር የለም።</p>'}catch(e){if(e.message.includes('ፍቃድ')){localStorage.removeItem('lottery-admin-token');location.reload()}else alert(e.message)}}
async function start(id){try{await api('/api/admin/rounds/'+id+'/start',{method:'POST'});load()}catch(e){alert(e.message)}}async function closeRound(id){try{await api('/api/admin/rounds/'+id+'/close',{method:'POST'});load()}catch(e){alert(e.message)}}async function draw(id){if(!confirm('የዚህን ዙር እጣ ማውጣት ይፈልጋሉ?'))return;try{const j=await api('/api/admin/draw',{method:'POST',body:JSON.stringify({roundId:id})});alert('🎉 አሸናፊዎች!\n'+j.winners.map(w=>w.place_label+': #'+w.number+' — '+Number(w.prize).toLocaleString()+' ETB').join('\n'));load()}catch(e){alert(e.message)}}
async function details(id){try{const j=await api('/api/admin/rounds/'+id);const pending=j.tickets.filter(t=>t.status==='pending');let text=`ዙር #${j.round.round_no}\nተጀመረ: ${j.round.started_at||'—'}\nተዘጋ: ${j.round.closed_at||'—'}\n\nPending: ${pending.length}`;if(pending.length)text+='\n\n'+pending.slice(0,30).map(t=>`#${t.number} • ${t.name} • ${t.phone}`).join('\n');alert(text)}catch(e){alert(e.message)}}$('date').value=new Date().toISOString().slice(0,10);$('login').style.display='block';$('panel').style.display='none';setupIdleTimeout();
</script></body></html>
